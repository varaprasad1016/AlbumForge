name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "m-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: mobile
        run: npm install

      - name: Build web app
        working-directory: mobile
        run: npm run build

      - name: Sync web + plugins
        working-directory: mobile
        run: npx cap sync android

      - name: Read app version
        id: version
        working-directory: mobile
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build debug APK (fixed demo keystore)
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -PafVersionName=${{ steps.version.outputs.VERSION }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: albumforge-android
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to release
        if: startsWith(github.ref, 'refs/tags/m-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: mobile/android/app/build/outputs/apk/debug/*.apk
