name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "m-*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: mobile
        run: npm install

      - name: Build web app
        working-directory: mobile
        run: npm run build

      - name: Sync web + plugins
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: albumforge-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release
        if: startsWith(github.ref, 'refs/tags/m-')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
