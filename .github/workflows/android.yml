name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "m-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        working-directory: mobile
        run: npm install

      - name: Build web app
        working-directory: mobile
        run: npm run build

      - name: Sync web + plugins
        working-directory: mobile
        run: npx cap sync android

      - name: Read app version
        id: version
        working-directory: mobile
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build debug APK (fixed demo keystore)
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -PafVersionName=${{ steps.version.outputs.VERSION }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: albumforge-android
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to release
        if: startsWith(github.ref, 'refs/tags/m-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          APK=$(ls mobile/android/app/build/outputs/apk/debug/*.apk | head -n1)
          TAG="${GITHUB_REF_NAME}"
          REPO="$GITHUB_REPOSITORY"
          BASE="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          UA="User-Agent: albumforge-ci"
          REL=$(curl -s -H "$AUTH" -H "$UA" "$BASE/releases/tags/$TAG")
          if echo "$REL" | grep -q '"message": "Not Found"'; then
            REL=$(curl -s -X POST -H "$AUTH" -H "$UA" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"AlbumForge $TAG\",\"prerelease\":true}" "$BASE/releases")
          fi
          REL_ID=$(echo "$REL" | jq -r '.id')
          for AID in $(echo "$REL" | jq -r '.assets[]?.id'); do
            curl -s -X DELETE -H "$AUTH" -H "$UA" "$BASE/releases/assets/$AID" -o /dev/null || true
          done
          UPLOAD_URL=$(echo "$REL" | jq -r '.upload_url' | sed 's/{?name,label}//')
          RESP=$(curl -s -X POST -H "$AUTH" -H "$UA" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" "$UPLOAD_URL?name=$(basename "$APK")")
          echo "$RESP"
          if ! echo "$RESP" | grep -q '"browser_download_url"'; then
            curl -s -X PATCH -H "$AUTH" -H "$UA" -H "Content-Type: application/json" \
              -d "{\"body\":\"publish failed: $RESP\"}" "$BASE/releases/$REL_ID" -o /dev/null
            echo "APK upload failed"
            exit 1
          fi
