name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        id: package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish never *> package.log
        continue-on-error: true

      - name: Upload package log on failure
        if: steps.package.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package-log
          path: package.log

      - name: Fail job if packaging failed
        if: steps.package.outcome != 'success'
        run: Get-Content package.log; exit 1

      - name: Upload installer artifact
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: albumforge-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Clean up stale release assets
        if: startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $base = "https://api.github.com/repos/$repo"
          $json = curl.exe -s -H "Authorization: Bearer $env:GH_TOKEN" -H "User-Agent: albumforge-ci" "$base/releases/tags/$tag"
          $rel = $json | ConvertFrom-Json
          if (-not $rel.id) { Write-Output "No existing release for $tag"; exit 0 }
          if (-not $rel.assets) { Write-Output "No assets to clean"; exit 0 }
          foreach ($a in @($rel.assets)) {
            Write-Output "Deleting asset $($a.name) (id=$($a.id))"
            curl.exe -s -X DELETE -H "Authorization: Bearer $env:GH_TOKEN" -H "User-Agent: albumforge-ci" -o NUL -w "%{http_code}" "$base/releases/assets/$($a.id)"
            Write-Output ""
            if ($LASTEXITCODE -ne 0) { Write-Error "Failed to delete asset $($a.id)"; exit 1 }
          }

      - name: Publish installer to release
        if: startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
