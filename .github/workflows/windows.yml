name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        id: package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --publish never *> package.log
        continue-on-error: true

      - name: Upload package log on failure
        if: steps.package.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: package-log
          path: package.log

      - name: Fail job if packaging failed
        if: steps.package.outcome != 'success'
        run: Get-Content package.log; exit 1

      - name: Upload installer artifact
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: albumforge-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Publish installer to release
        if: startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
