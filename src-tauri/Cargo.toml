[package]
name = "albumforge"
version = "0.10.16"
description = "AlbumForge native backend (Tauri 2 / Rust) — asset scanning, editor proxies, 300 DPI export"
authors = ["Vara"]
edition = "2021"

[lib]
name = "albumforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# Native open/save dialogs (Phase 4) — parity with Electron's `dialog` module.
tauri-plugin-dialog = "2"
# Auto-update from GitHub Releases (Phase 7) — parity with electron-updater:
# same hosting/feed semantics (GitHub release artifacts + a JSON manifest),
# minisign-signed NSIS installers.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
walkdir = "2"
kamadak-exif = "0.6"
# Decoders for jpeg/png/webp + parallel ops. Full-size originals are only
# ever opened inside the native backend (proxy + export), never in the UI.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
# Local SQLite storage (ported from better-sqlite3 in the Electron shell).
# Bundled so no system dependency is required on macOS/Windows/Linux.
rusqlite = { version = "0.32", features = ["bundled"] }
# UUID v4 photo/project ids + UTC timestamps matching the Electron shell's
# randomUUID() / new Date().toISOString().
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# External HTTP providers (Phase 4/6 pull-forward: stock search/download +
# AI generation). rustls keeps the TLS stack pure-Rust — no system OpenSSL
# needed on the GNU/w64devkit fallback toolchain.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
# API keys live in the OS keychain behind core/secrets.rs (never on disk).
keyring = "3"
# base64 data URIs (gen/assets) + percent-encoding (pollinations prompt, svg URIs).
base64 = "0.22"
urlencoding = "2"

# Commercial pass (blueprint §10 / MIGRATION Phase 9) — all pure-Rust so the
# GNU/w64devkit fallback toolchain keeps compiling:
#  - zip: .album project archives (layout JSON + embedded proxy thumbnails).
#  - ed25519-dalek: offline license signature verification (Keygen signs
#    licenses with Ed25519); std-only — no key generation needed at runtime.
#  - sha2: stable machine fingerprint (hostname|user) for seat binding.
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

# NOTE: printpdf / tiff land here when the PDF/TIFF assembly step of the
# export engine is implemented (see src/core/export.rs).

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
