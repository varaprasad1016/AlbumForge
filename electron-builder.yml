appId: com.albumforge.app
productName: AlbumForge
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!**/*.map"
asarUnpack:
  - node_modules/sharp/**
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/fonts
    to: fonts
publish:
  - provider: github
    owner: varaprasad1016
    repo: AlbumForge
    releaseType: release
afterPack: scripts/after-pack.cjs
win:
  target:
    - nsis
  executableName: AlbumForge
  # Skip rcedit/code-signing so packaging works without Windows Developer Mode
  # (no certificate yet). Re-enable and provide a cert for production.
  signAndEditExecutable: false
nsis:
  oneClick: true
  createDesktopShortcut: true
  # Fixed dash-separated name so the asset matches the url in latest.yml
  # (electron-updater looks up the file by that exact name).
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  category: public.app-category.photography
  target:
    - dmg
    - zip
  # Unsigned for now (no Apple Developer certificate). Users will see a Gatekeeper
  # warning: right-click → Open. Notarization requires an Apple Developer account.
  identity: null
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
