appId: com.albumforge.app
productName: AlbumForge
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!**/*.map"
asarUnpack:
  - node_modules/sharp/**
  - node_modules/better-sqlite3/**
publish:
  - provider: github
    owner: varaprasad1016
    repo: AlbumForge
    releaseType: release
win:
  target:
    - nsis
  executableName: AlbumForge
  # Skip rcedit/code-signing so packaging works without Windows Developer Mode
  # (no certificate yet). Re-enable and provide a cert for production.
  signAndEditExecutable: false
nsis:
  oneClick: true
  createDesktopShortcut: true
mac:
  category: public.app-category.photography
  target:
    - dmg
